name: 构建 Windows 版

# 打 tag（v1.0.0 这种）会自动构建并发布 Release；
# 也可以在 Actions 页面手动触发，只产出 artifact。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.11"

      # datas 里的 glob 匹配不到文件时 PyInstaller 不会报错，
      # 结果就是打出一个图标/字体全缺的 exe，所以先自己检查一遍
      - name: 检查打包资源是否齐全
        shell: pwsh
        run: |
          $need = @(
            'server.py',
            'web/index.html',
            'web/qrcode.min.js',
            'web/fonts/material-symbols-rounded.woff2',
            'assets/icon.png',
            'assets/favicon.ico',
            'assets/icon.ico'
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "缺少以下文件，打包会出问题："
            $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "资源齐全 ✓"

      - name: 打包
        run: pyinstaller QuickShare.spec --noconfirm --clean

      # 光有 exe 不算数，真跑起来抽查几个关键路由
      - name: 冒烟测试（启动 exe 验证接口）
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/QuickShare.exe').Path
          Write-Host ("exe 大小: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

          # onefile 启动要解包，再加上 Defender 扫描，冷启动可能偏慢，所以最多等 30 秒
          # 另外 PyInstaller onefile 是「引导进程 + 真正干活的子进程」，结束时要 taskkill /T 连子进程一起收掉
          $proc = Start-Process -FilePath $exe -PassThru `
                    -RedirectStandardOutput 'dist/run.log' -RedirectStandardError 'dist/run.err'
          Write-Host "已启动 exe (PID $($proc.Id))，等待服务就绪…"

          $port = 8000
          $up = $false
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            # exe 会把自己实际监听的端口打进日志（配置端口被占用时会顺延）
            $m = Select-String -Path 'dist/run.log' -Pattern 'localhost:(\d+)' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
            if ($m) { $port = [int]$m.Matches[0].Groups[1].Value }
            # 探端口用 TcpClient：在 runner 上起一次 curl.exe 要 ~2 秒，60 次就是两分钟
            try {
              $client = New-Object Net.Sockets.TcpClient
              $client.Connect('127.0.0.1', $port)
              $client.Close()
              $up = $true
              break
            } catch {}
          }
          # 端口通了再确认能真的返回页面
          if ($up) {
            $code = curl.exe -s -o NUL --max-time 5 -w "%{http_code}" "http://127.0.0.1:$port/"
            if ($code -ne '200') { $up = $false }
          }

          # 不管成功失败都把 exe 的输出打出来，省得去猜
          Write-Host "----- exe stdout -----"
          Get-Content 'dist/run.log' -ErrorAction SilentlyContinue
          $err = Get-Content 'dist/run.err' -ErrorAction SilentlyContinue
          if ($err) { Write-Host "----- exe stderr -----"; $err }

          if (-not $up) {
            & taskkill /F /T /PID $proc.Id 2>$null | Out-Null
            Write-Host "::error::exe 启动后 30 秒内没就绪（端口 $port）"
            exit 1
          }
          Write-Host "服务已就绪，端口 $port"

          $base = "http://127.0.0.1:$port"
          $failed = @()
          foreach ($path in @('/api/host', '/api/files', '/fonts/material-symbols-rounded.woff2',
                              '/fonts/roboto-latin.woff2', '/icon.png', '/favicon.ico', '/qrcode.min.js')) {
            $out  = curl.exe -s -o NUL --max-time 10 -w "%{http_code} %{time_total}" "$base$path"
            $code = ($out -split '\s+')[0]
            $sec  = ($out -split '\s+')[1]
            Write-Host ("  {0,-42} {1}  {2}s" -f $path, $code, $sec)
            if ($code -ne '200') { $failed += $path }
          }

          & taskkill /F /T /PID $proc.Id 2>$null | Out-Null
          if ($failed.Count -gt 0) {
            Write-Host "::error::这些路由没返回 200: $($failed -join ', ')"
            exit 1
          }
          Write-Host "冒烟测试通过 ✓"

      # 失败时也能看到 exe 自己吐了什么，否则日志要登录才能翻
      - name: 留下 exe 运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            dist/run.log
            dist/run.err
          if-no-files-found: ignore

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuickShare-windows
          path: dist/QuickShare.exe
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          # GH Actions 里 $ErrorActionPreference=Stop，而 gh 查不到 release 会把信息写到 stderr，
          # 所以这里临时放开，只看退出码
          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag dist/QuickShare.exe --clobber    # 同 tag 重跑：覆盖附件
          } else {
            gh release create $tag dist/QuickShare.exe --title $tag --generate-notes
          }
