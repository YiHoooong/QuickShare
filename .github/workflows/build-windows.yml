name: 构建 Windows 版

# 打 tag（v1.0.0 这种）会自动构建并发布 Release；
# 也可以在 Actions 页面手动触发，只产出 artifact。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.11"

      # datas 里的 glob 匹配不到文件时 PyInstaller 不会报错，
      # 结果就是打出一个图标/字体全缺的 exe，所以先自己检查一遍
      - name: 检查打包资源是否齐全
        shell: pwsh
        run: |
          $need = @(
            'server.py',
            'web/index.html',
            'web/qrcode.min.js',
            'web/fonts/material-symbols-rounded.woff2',
            'assets/icon.png',
            'assets/favicon.ico',
            'assets/icon.ico'
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "缺少以下文件，打包会出问题："
            $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          Write-Host "资源齐全 ✓"

      - name: 打包
        run: pyinstaller QuickShare.spec --noconfirm --clean

      # 光有 exe 不算数，真跑起来抽查几个关键路由
      - name: 冒烟测试（启动 exe 验证接口）
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/QuickShare.exe').Path
          Write-Host ("exe 大小: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

          $proc = Start-Process -FilePath $exe -PassThru `
                    -RedirectStandardOutput 'dist/run.log' -RedirectStandardError 'dist/run.err'

          $base = 'http://127.0.0.1:8000'
          $up = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ((curl.exe -s -o NUL -w "%{http_code}" "$base/") -eq '200') { $up = $true; break }
          }
          if (-not $up) {
            Write-Host "----- exe stdout -----"; Get-Content 'dist/run.log' -ErrorAction SilentlyContinue
            Write-Host "----- exe stderr -----"; Get-Content 'dist/run.err' -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Error "服务 30 秒内没有起来（上面日志里能看到它实际用的端口）"
            exit 1
          }
          Write-Host "服务已启动"

          $failed = 0
          foreach ($path in @('/api/host', '/api/files', '/fonts/material-symbols-rounded.woff2',
                              '/fonts/roboto-latin.woff2', '/icon.png', '/favicon.ico', '/qrcode.min.js')) {
            $code = curl.exe -s -o NUL -w "%{http_code}" "$base$path"
            Write-Host ("  {0,-42} {1}" -f $path, $code)
            if ($code -ne '200') { $failed++ }
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($failed -gt 0) { Write-Error "$failed 个路由没返回 200"; exit 1 }
          Write-Host "冒烟测试通过 ✓"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuickShare-windows
          path: dist/QuickShare.exe
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          # GH Actions 里 $ErrorActionPreference=Stop，而 gh 查不到 release 会把信息写到 stderr，
          # 所以这里临时放开，只看退出码
          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag dist/QuickShare.exe --clobber    # 同 tag 重跑：覆盖附件
          } else {
            gh release create $tag dist/QuickShare.exe --title $tag --generate-notes
          }
